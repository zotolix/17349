<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nombramientos</title>
</head>

<body>
    <h1>Nombramientos</h1>
    <button onclick="Npost()">Nombramientos fetch</button>
    <script>
        let url = "http://localhost:8081/nombramientos"

        function Npost() {
            fetch(url, {
                method: 'POST',
            })
                .then(response => response.text()) 
                .then(datos => {
                    console.log(datos);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function nombramientos2() {
            url = "http://localhost:8081/nombramientos"
            xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                if (this.status == 200) {
                    console.log(this.responseText);
                }
            };
            xhttp.open("GET", url);
            xhttp.send();
        }                
    </script>
</body>

</html>
</body>

</html>
